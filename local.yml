services:
  django:
    container_name: kkamara_local_django
    build:
      context: .
      dockerfile: ./compose/local/django/Dockerfile
    image: kkamara_local_django
    restart: unless-stopped
    platform: linux/x86_64
    depends_on:
      - mysql
      - mailhog
    volumes:
      - .:/app:z
    env_file:
      - .env
    ports:
      - "8000:8000"
    command: /start
    networks:
      - kkamara_app
  mysql:
    container_name: kkamara_local_mysql
    image: 'mysql:8.0'
    restart: unless-stopped
    ports:
      - '${DB_PORT:-3306}:${DB_PORT:-3306}'
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_PASS}
      - MYSQL_DATABASE=${DB_NAME}
      - MYSQL_USER=${DB_USER}
      - MYSQL_PASSWORD=${DB_PASS}
      - MYSQL_ALLOW_EMPTY_PASSWORD=yes
    volumes:
      - "mysql:/var/lib/mysql"
    networks:
      - kkamara_app
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-p${DB_PASS}"]
  mailhog:
    container_name: kkamara_local_mailhog
    restart: unless-stopped
    image: mailhog/mailhog
    ports:
      - 1025:1025
      - 8025:8025 
    networks:
      - kkamara_app

networks:
  kkamara_app:
    driver: bridge

volumes:
  mysql:
    driver: local
